<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">Two independent Codex Desktop profiles</title>
  <desc id="desc">A single Codex installation with separate ChatGPT and gateway profiles.</desc>
  <rect width="1000" height="410" rx="24" fill="#f5f7fc"/>
  <rect x="290" y="22" width="420" height="78" rx="17" fill="#102441"/>
  <text x="500" y="52" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="white">OpenAI.Codex (Windows Store)</text>
  <text x="500" y="78" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#dbeafe">One installation · Two isolated profiles</text>
  <path d="M500 100 V129 H250 V151 M500 129 H750 V151" fill="none" stroke="#627d9c" stroke-width="4" stroke-linecap="round"/>
  <rect x="42" y="151" width="418" height="224" rx="16" fill="white" stroke="#2764dc" stroke-width="3"/>
  <rect x="42" y="151" width="418" height="62" rx="16" fill="#2764dc"/>
  <rect x="42" y="190" width="418" height="23" fill="#2764dc"/>
  <text x="251" y="189" text-anchor="middle" font-size="24" font-family="Arial,sans-serif" font-weight="700" fill="white">MAIN · ChatGPT plan</text>
  <text x="68" y="246" font-size="17" font-family="Arial,sans-serif" fill="#152b48">Normal Codex shortcut</text>
  <rect x="67" y="263" width="367" height="39" rx="8" fill="#eaf1ff"/>
  <text x="80" y="289" font-size="16" font-family="Consolas,monospace" fill="#233e64">%USERPROFILE%\.codex</text>
  <text x="68" y="336" font-size="16" font-family="Arial,sans-serif" fill="#53657b">Default app data · ChatGPT login</text>
  <rect x="540" y="151" width="418" height="224" rx="16" fill="white" stroke="#7a42dd" stroke-width="3"/>
  <rect x="540" y="151" width="418" height="62" rx="16" fill="#7a42dd"/>
  <rect x="540" y="190" width="418" height="23" fill="#7a42dd"/>
  <text x="749" y="189" text-anchor="middle" font-size="24" font-family="Arial,sans-serif" font-weight="700" fill="white">SECOND · AI Gateway</text>
  <text x="566" y="246" font-size="17" font-family="Arial,sans-serif" fill="#152b48">Separate launcher and shortcut</text>
  <rect x="565" y="263" width="367" height="39" rx="8" fill="#f0eaff"/>
  <text x="579" y="289" font-size="15" font-family="Consolas,monospace" fill="#473276">CODEX_HOME = isolated profile</text>
  <text x="566" y="336" font-size="16" font-family="Arial,sans-serif" fill="#53657b">Separate web-data · DPAPI API key</text>
</svg>
