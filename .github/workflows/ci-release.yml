name: PowerShell checks and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable repository checks
        shell: pwsh
        run: python ./tests/validate_repo.py
      - name: PowerShell syntax and safety checks
        shell: pwsh
        run: ./tests/Static-Checks.ps1

  release:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package downloadable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path README.md,README.en.md,LICENSE,CHANGELOG.md,CONTRIBUTING.md,.gitignore,scripts,docs,tests -DestinationPath Codex-Dual-Profile-Windows.zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 Codex-Dual-Profile-Windows.zip).Hash.ToLowerInvariant()
          "$hash  Codex-Dual-Profile-Windows.zip" | Set-Content -Path SHA256SUMS.txt -Encoding ascii
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" Codex-Dual-Profile-Windows.zip SHA256SUMS.txt --title "Codex Dual Profile Manager ${{ github.ref_name }}" --notes "Unofficial community beta. Read README and security notes before running. Windows GUI/MSIX compatibility is version-sensitive."
